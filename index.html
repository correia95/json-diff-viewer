    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Does JSON key order matter for the diff?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No, two objects with the same keys and values are treated as identical regardless of order."
            }
          },
          {
            "@type": "Question",
            "name": "How are array differences shown?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "By index. Inserting an element in the middle of an array will show as changes to every following index plus one addition at the end, since this compares by position rather than detecting a reordering."
            }
          },
          {
            "@type": "Question",
            "name": "What happens if a value changes type entirely?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A value changing from an object to an array, or a number to a string, is shown as a single changed entry with the old and new value in full."
            }
          }
        ]
      }
    </script>
